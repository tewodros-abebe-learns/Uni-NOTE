name: Firestore rules (emulator)
# Manual / rules-change verification with the real Firebase emulator.
# Kept separate from the required CI check so emulator setup can never
# block the main pipeline.
on:
  workflow_dispatch:
  pull_request:
    paths: ['firestore.rules']
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: npm install -g firebase-tools
      - name: Verify rules compile in the emulator
        run: firebase emulators:exec --only firestore --project steadfast-rigging-g2w8r "echo rules-compiled-ok"
